<style>[hidden]{display:none!important}
.sum{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:6px 0 22px}.sum div{background:#fff;border:1px solid var(--line);padding:10px 12px}.sum b{display:block;font:700 26px "Space Grotesk",sans-serif}.sum span{font-size:12.5px;color:var(--mid)}
.grp{margin:26px 0 8px;display:flex;align-items:baseline;gap:10px}.grp h3{margin:0}.grp small{color:var(--mid);font-size:13px}
.lib{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

.it summary{cursor:pointer;list-style:none;padding:9px 12px;display:flex;gap:10px;align-items:center}

.it summary b{flex:1;font-size:14.5px}
.it summary i{font-style:normal;color:var(--mid);transition:transform .2s}
.it[open]{border-color:var(--fg);grid-column:1/-1}.it[open] summary i{transform:rotate(180deg)}
.bd{display:flex;gap:14px;padding:0 12px 12px;align-items:flex-start}
.bd canvas,.bd img,.bd video{width:150px;height:267px;flex:none;background:#eee;object-fit:cover}
.bd p{margin:0 0 8px;font-size:14px;line-height:1.7}
