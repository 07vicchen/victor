<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AI 客服建置問卷｜維拓傳媒</title>
<meta name="theme-color" content="#0a0a0a">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
:root{--bg:#0a0a0a;--s2:#141414;--s3:#1a1a1a;--ink:#f4f4f4;--mute:#a6a6a6;--line:#2a2a2a;--line2:#666;--brand:#c8ff3d;--brandt:#d3ff66;--soft:#1f2a08;--bad:#ff6b6b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;font-size:16px;line-height:1.7}
a{color:var(--brandt)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brandt);outline-offset:3px}
.wrap{max-width:820px;margin:0 auto;padding:0 20px}
header{border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;padding-top:14px;padding-bottom:14px}
.top img{width:40px;height:40px}
.top b{font-weight:900;font-size:18px;display:block;line-height:1.1}
.top small{font-family:'IBM Plex Sans',sans-serif;font-size:10px;letter-spacing:.18em;color:var(--mute)}
.hero{padding-top:44px;padding-bottom:28px}
.eyebrow{font-family:'IBM Plex Sans',sans-serif;font-size:12px;font-weight:600;letter-spacing:.2em;color:var(--brandt)}
h1{margin:10px 0 12px;font-weight:900;font-size:clamp(28px,6vw,44px);line-height:1.2;letter-spacing:-.03em}
.lead{color:var(--mute);margin:0;max-width:34em}
.bar{position:sticky;top:0;z-index:5;background:rgba(10,10,10,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:14px;padding-top:10px;padding-bottom:10px}
.track{flex:1;height:6px;background:var(--line)}
.fill{height:100%;background:var(--brand);transition:width .3s}
.bar span{font-family:'IBM Plex Sans',sans-serif;font-size:13px;color:var(--mute);white-space:nowrap}
.secs{padding:24px 0 8px;display:flex;flex-direction:column;gap:10px}
.sec{border:1px solid var(--line);background:var(--s2)}
.sec.open{border-color:var(--brand);background:var(--bg)}
.sec>button{width:100%;display:flex;align-items:center;gap:14px;padding:18px 18px;background:none;border:0;cursor:pointer;text-align:left;min-height:64px}
.num{flex:none;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:14px;background:var(--line)}
.sec.open .num{background:var(--brand);color:#0a0a0a}
.sec.done .num{background:var(--soft);color:var(--brandt)}
.st{flex:1;min-width:0}
.st b{display:block;font-weight:900;font-size:18px}
.st small{color:var(--mute);font-size:13px}
.mark{font-family:'IBM Plex Sans',sans-serif;font-size:22px;color:var(--mute)}
.body{padding:0 18px 22px}
.desc{margin:0 0 18px;color:var(--mute);font-size:15px;padding:12px 14px;background:var(--s3);border-left:2px solid var(--brand)}
.fld{margin:0 0 18px}
.fld>label,.fld>.lab{display:block;font-weight:700;margin:0 0 6px;font-size:15px}
.req{color:var(--brandt);font-size:12px;margin-left:6px}
input[type=text],input[type=tel],input[type=number],select,textarea{width:100%;background:var(--s2);border:1px solid var(--line2);padding:12px 14px;border-radius:0;font-size:16px}
textarea{resize:vertical;min-height:84px;line-height:1.6}
input::placeholder,textarea::placeholder{color:#777}
.bad input,.bad select{border-color:var(--bad)}
.err{color:var(--bad);font-size:13px;margin-top:4px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);padding:10px 14px;cursor:pointer;min-height:44px;font-size:15px}
.opt input{accent-color:var(--brand);width:18px;height:18px;margin:0}
.opt:has(input:checked){border-color:var(--brand);background:var(--soft);color:var(--brandt)}
.faq{border-top:1px solid var(--line);padding:14px 0 4px}
.faq .q{font-weight:700;margin:0 0 6px;font-size:15px}
.drop{border:1px dashed var(--line2);padding:16px;text-align:center;color:var(--mute);font-size:14px;cursor:pointer;display:block}
.drop:hover{border-color:var(--brand);color:var(--brandt)}
.drop input{display:none}
.flist{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.fitem{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;background:var(--s3);font-size:14px}
.fitem span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fitem button{background:none;border:0;color:var(--mute);cursor:pointer;padding:6px;min-width:44px;min-height:36px}
.next{display:flex;justify-content:flex-end}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 22px;border:1px solid var(--line2);background:none;cursor:pointer;font-weight:700;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#0a0a0a;font-weight:900}
.btn:disabled{opacity:.5;cursor:default}
.submit{margin:24px 0 64px;padding:24px;border:1px solid var(--line);background:var(--s2);display:flex;flex-direction:column;gap:14px}
.submit p{margin:0;color:var(--mute);font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.save{font-size:13px;color:var(--mute);font-family:'IBM Plex Sans','Noto Sans TC',sans-serif}
.msg{padding-top:80px;padding-bottom:80px;text-align:center}
.msg h1{font-size:clamp(26px,5vw,36px)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#0a0a0a;padding:12px 18px;font-weight:700;z-index:20;max-width:90vw}
footer{border-top:1px solid var(--line);color:var(--mute);font-size:13px;padding-top:22px;padding-bottom:40px}
#print{display:none}

.sum-sec{break-inside:auto;margin:0 0 28px}
.sum-sec h2{font-size:18px;font-weight:900;margin:0 0 8px;padding:0 0 8px;border-bottom:2px solid currentColor}
.sum-row{display:grid;grid-template-columns:minmax(120px,32%) 1fr;gap:6px 18px;padding:10px 0;border-bottom:1px solid rgba(128,128,128,.3);break-inside:avoid}
.sum-q{font-weight:700;font-size:14px;opacity:.75}
.sum-a{white-space:pre-wrap;font-size:15px;line-height:1.7;word-break:break-word}
.sum-empty{opacity:.45}
.sum-img{width:140px;height:140px;object-fit:cover;margin:0 8px 8px 0;border:1px solid rgba(128,128,128,.4)}
@media (max-width:560px){.sum-row{grid-template-columns:1fr}}

@media print{
  @page{margin:16mm 14mm}
  html,body{background:#fff!important;color:#111!important}
  #app,.toast{display:none!important}
  #print{display:block;color:#111;font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif}
  #print a{color:#111}
  .p-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #111;padding-bottom:10px;margin-bottom:22px}
  .p-head h1{font-size:22px;margin:0}
  .p-head div{font-size:12px;color:#555;text-align:right}
}
</style>
</head>
<body>
<div id="app"><div class="msg wrap"><p class="lead">載入中…</p></div></div>
<div id="print"></div>
<script>
const API = 'https://cswhroimywfyokxxogis.supabase.co/functions/v1/aics-intake';
async function call(body, adminKey){
  const h = {'content-type':'application/json'}; if (adminKey) h['x-admin-key'] = adminKey;
  let r; try { r = await fetch(API, {method:'POST', headers:h, body:JSON.stringify(body)}); } catch(e){ throw new Error('網路連不上，請檢查網路再試一次'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok || j.error) throw new Error(j.error || '系統忙碌，請稍後再試');
  return j;
}
const INDUSTRIES = [
  ['beauty','美容美體・美髮美甲'],['clinic','診所・醫美'],['food','餐飲'],['edu','補習・課程'],['retail','零售・網拍'],['other','其他服務']
];
const BANK = {
  beauty: ['第一次來大概多少錢？','做完會不會紅？多久會恢復？','多久要做一次才看得到效果？','敏感肌、孕婦可以做嗎？','你們跟別家差在哪裡？','可以刷卡、分期嗎？','要提前多久預約？當天可以約嗎？','停車、交通方不方便？'],
  clinic: ['第一次諮詢要收費嗎？','療程大概多少錢？可以分期嗎？','做完恢復期多久？','哪些人不適合做？','醫師是誰？看診時間？','要怎麼預約？需要帶什麼？','做完有問題可以回診嗎？'],
  food: ['可以訂位嗎？幾個人可以包場？','有素食或兒童餐嗎？','有低消或服務費嗎？','可以外帶、外送嗎？用哪個平台？','停車方便嗎？','可以帶寵物嗎？','有慶生服務嗎？','最推薦哪一道？'],
  edu: ['課程怎麼收費？可以試聽嗎？','一班幾個人？','上課時間？缺課可以補嗎？','適合什麼程度的人？','退費怎麼算？','老師的背景？','可以線上上課嗎？'],
  retail: ['運費多少？多久會到？','可以退換貨嗎？','有沒有現貨？','尺寸怎麼挑？','可以貨到付款嗎？','有實體店可以看嗎？','有會員優惠嗎？'],
  other: ['價格大概多少？','要怎麼預約或下單？','服務流程是什麼？','大概需要多久時間？','可以取消或退費嗎？','服務哪些地區？','可以怎麼付款？']
};
// 問卷結構：type text|tel|area|select|radio|check|num|files|faq
function sections(ind){
  return [
    {id:'basic', t:'基本資料', d:'讓我們知道你是誰、怎麼聯絡你。', f:[
      {k:'store_name', l:'店名', type:'text', req:1, ph:'例如：逆光美學'},
      {k:'industry', l:'行業', type:'select', req:1, opts:INDUSTRIES},
      {k:'contact_name', l:'聯絡人', type:'text', req:1},
      {k:'phone', l:'手機', type:'tel', req:1},
      {k:'address', l:'店家地址', type:'text'},
      {k:'hours', l:'營業時間與公休', type:'area', ph:'例如：週二到週日 11:00–21:00，週一公休'},
      {k:'line_oa', l:'LINE 官方帳號 ID', type:'text', ph:'@ 開頭那串，還沒有可以留白'},
      {k:'links', l:'官網或 IG', type:'text'}
    ]},
    {id:'sell', t:'你賣什麼', d:'AI 只會照這裡的資料回答，寫得越清楚，它越不會講錯。', f:[
      {k:'services', l:'服務或商品，跟價格', type:'area', rows:6, ph:'一行一項就好，例如：\n小臉緊緻 首次 1,980／原價 3,200，約 60 分鐘'},
      {k:'price_files', l:'價目表照片', type:'files', field:'price', hint:'拍照、截圖、PDF 都可以'},
      {k:'promos', l:'目前的優惠，跟使用條件', type:'area', ph:'例如：首次體驗價限新客、一人一次；十堂套票一年內用完'},
      {k:'booking', l:'客人要怎麼預約', type:'area', ph:'例如：LINE 留姓名、手機、想約的日期時段，我們確認後回覆'}
    ]},
    {id:'faq', t:'客人常問的問題', d:'這些是你這個行業最常被問的。照你平常的回法寫，不知道怎麼寫的可以留白，我們再打電話問你。', f:[
      {k:'faq', type:'faq', qs:BANK[ind] || BANK.other},
      {k:'faq_extra', l:'還有哪些常被問的？（問題跟你的回答）', type:'area', rows:4}
    ]},
    {id:'sales', t:'你怎麼成交', d:'AI 會照你的說法推銷，所以這段最重要。用你平常講話的方式寫就好。', f:[
      {k:'s_expensive', l:'客人說「太貴了」，你怎麼回？', type:'area'},
      {k:'s_think', l:'客人說「我再想想」，你怎麼回？', type:'area'},
      {k:'s_doubt', l:'客人擔心沒效、怕踩雷，你怎麼回？', type:'area'},
      {k:'s_compare', l:'客人拿別家比較，你怎麼回？', type:'area'},
      {k:'s_closer', l:'你最常用來約客人的一句話', type:'area', ph:'例如：這週六下午還有一個時段，要幫你留嗎？'},
      {k:'chat_files', l:'成交的對話截圖（5 到 10 張最好）', type:'files', field:'chats', hint:'客人的名字和頭像可以先塗掉'}
    ]},
    {id:'voice', t:'講話的感覺', d:'讓 AI 聽起來像你店裡的人。', f:[
      {k:'persona', l:'希望 AI 像誰', type:'radio', opts:[['owner','像老闆本人'],['staff','像親切的小編'],['pro','像專業顧問']]},
      {k:'you', l:'怎麼稱呼客人', type:'radio', opts:[['ni','你'],['nin','您'],['name','叫名字或暱稱']]},
      {k:'emoji', l:'表情符號', type:'radio', opts:[['often','常用'],['some','偶爾'],['none','不用']]},
      {k:'voice_note', l:'口頭禪、常用的結尾，或不喜歡的講法', type:'area', ph:'例如：結尾常加「喔～」；不要叫客人「親」'}
    ]},
    {id:'rules', t:'規矩', d:'哪些話不能講、什麼情況一定要交給你。', f:[
      {k:'never', l:'絕對不能講的話', type:'area', ph:'例如：不能保證效果、不能說別家壞話、不能私下給折扣'},
      {k:'handoff', l:'這些情況一定要轉給你', type:'check', opts:[['complaint','客訴、不開心'],['refund','退款、退費'],['bargain','議價、要求額外折扣'],['body','做完不舒服、身體狀況'],['ask','指名要找真人'],['big','大單、團購、合作']]},
      {k:'handoff_other', l:'其他要轉給你的情況', type:'text'},
      {k:'notify', l:'通知要傳給誰（LINE 名稱）', type:'text', ph:'成交、客訴通知會傳到這個人的 LINE'}
    ]},
    {id:'follow', t:'關心與跟進', d:'客人做完、沒下文、很久沒來的時候，AI 要怎麼主動聯絡。', f:[
      {k:'care_after', l:'消費後多久問候一次', type:'radio', opts:[['1','隔天'],['3','三天後'],['0','不需要']]},
      {k:'revisit_days', l:'幾天後提醒回訪', type:'num', ph:'例如 30，不需要就留白'},
      {k:'dormant_days', l:'多久沒來算「很久沒來」', type:'num', ph:'例如 60'},
      {k:'birthday', l:'生日要不要送祝福', type:'radio', opts:[['yes','要'],['no','不用']]},
      {k:'send_mode', l:'推銷訊息', type:'radio', opts:[['auto','直接發，成交再通知我'],['review','先給我看過再發']]}
    ]}
  ];
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function labelOf(opts, v){ const o = (opts||[]).find(x => x[0] === v); return o ? o[1] : v; }
// 給 PDF / 後台看的整理版
function summaryHTML(a, files){
  a = a || {}; files = files || [];
  const ind = a.industry || 'other';
  let h = '';
  for (const s of sections(ind)){
    h += `<section class="sum-sec"><h2>${esc(s.t)}</h2>`;
    for (const f of s.f){
      if (f.type === 'faq'){
        f.qs.forEach((q,i) => { const v = (a.faq||{})[q]; h += `<div class="sum-row"><div class="sum-q">${esc(q)}</div><div class="sum-a">${v ? esc(v) : '<span class="sum-empty">（未填）</span>'}</div></div>`; });
        continue;
      }
      if (f.type === 'files'){
        const fs = files.filter(x => x.field === f.field);
        h += `<div class="sum-row"><div class="sum-q">${esc(f.l)}</div><div class="sum-a">${fs.length ? fs.map(x => x.url && x.type.startsWith('image/') ? `<a href="${esc(x.url)}" target="_blank" rel="noopener"><img class="sum-img" src="${esc(x.url)}" alt="${esc(x.name)}"></a>` : `<div>📎 ${x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.name)}</a>` : esc(x.name)}</div>`).join('') : '<span class="sum-empty">（沒有上傳）</span>'}</div></div>`;
        continue;
      }
      let v = a[f.k];
      if (f.type === 'select' || f.type === 'radio') v = v ? labelOf(f.opts, v) : '';
      if (f.type === 'check') v = (v||[]).map(x => labelOf(f.opts, x)).join('、');
      h += `<div class="sum-row"><div class="sum-q">${esc(f.l)}</div><div class="sum-a">${v ? esc(v) : '<span class="sum-empty">（未填）</span>'}</div></div>`;
    }
    h += '</section>';
  }
  return h;
}
const SUM_CSS = `
.sum-sec{break-inside:auto;margin:0 0 28px}
.sum-sec h2{font-size:18px;font-weight:900;margin:0 0 8px;padding:0 0 8px;border-bottom:2px solid currentColor}
.sum-row{display:grid;grid-template-columns:minmax(120px,32%) 1fr;gap:6px 18px;padding:10px 0;border-bottom:1px solid rgba(128,128,128,.3);break-inside:avoid}
.sum-q{font-weight:700;font-size:14px;opacity:.75}
.sum-a{white-space:pre-wrap;font-size:15px;line-height:1.7;word-break:break-word}
.sum-empty{opacity:.45}
.sum-img{width:140px;height:140px;object-fit:cover;margin:0 8px 8px 0;border:1px solid rgba(128,128,128,.4)}

const token = new URLSearchParams(location.search).get('k') || '';
const S = { a:{}, files:[], open:'basic', locked:false, status:'', submitted:false, saving:'', touched:false, errors:{} };
const app = document.getElementById('app');
const LS = 'aics-intake-' + token;

function toast(t){ const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }

function filled(f){
  const a = S.a;
  if (f.type === 'faq') return f.qs.some(q => (a.faq||{})[q]);
  if (f.type === 'files') return S.files.some(x => x.field === f.field);
  if (f.type === 'check') return (a[f.k]||[]).length > 0;
  return !!String(a[f.k] ?? '').trim();
}
function secDone(s){ const need = s.f.filter(f => f.req); return need.length ? need.every(filled) : s.f.some(filled); }

function fieldHTML(f){
  const a = S.a, v = a[f.k] ?? '', err = S.errors[f.k];
  const lab = f.l ? `<label for="f-${f.k}">${esc(f.l)}${f.req ? '<span class="req">必填</span>' : ''}</label>` : '';
  let inner = '';
  switch (f.type){
    case 'text': case 'tel': inner = `<input id="f-${f.k}" type="${f.type}" data-k="${f.k}" value="${esc(v)}" placeholder="${esc(f.ph||'')}" ${f.type==='tel'?'inputmode="tel" autocomplete="tel"':''}>`; break;
    case 'num': inner = `<input id="f-${f.k}" type="number" inputmode="numeric" min="0" data-k="${f.k}" value="${esc(v)}" placeholder="${esc(f.ph||'')}">`; break;
    case 'area': inner = `<textarea id="f-${f.k}" data-k="${f.k}" rows="${f.rows||3}" placeholder="${esc(f.ph||'')}">${esc(v)}</textarea>`; break;
    case 'select': inner = `<select id="f-${f.k}" data-k="${f.k}"><option value="">請選擇</option>${f.opts.map(o => `<option value="${o[0]}" ${v===o[0]?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`; break;
    case 'radio': return `<div class="fld"><span class="lab">${esc(f.l)}</span><div class="opts" role="radiogroup">${f.opts.map(o => `<label class="opt"><input type="radio" name="${f.k}" data-k="${f.k}" value="${o[0]}" ${v===o[0]?'checked':''}>${esc(o[1])}</label>`).join('')}</div></div>`;
    case 'check': return `<div class="fld"><span class="lab">${esc(f.l)}</span><div class="opts">${f.opts.map(o => `<label class="opt"><input type="checkbox" data-c="${f.k}" value="${o[0]}" ${(v||[]).includes(o[0])?'checked':''}>${esc(o[1])}</label>`).join('')}</div></div>`;
    case 'faq': return f.qs.map((q,i) => `<div class="faq"><p class="q">${i+1}. ${esc(q)}</p><textarea data-faq="${esc(q)}" rows="2" aria-label="${esc(q)}" placeholder="你平常怎麼回？">${esc((a.faq||{})[q]||'')}</textarea></div>`).join('') + '<div style="height:14px"></div>';
    case 'files': {
      const fs = S.files.filter(x => x.field === f.field);
      return `<div class="fld"><span class="lab">${esc(f.l)}</span><label class="drop">＋ 選擇檔案上傳<br><small>${esc(f.hint||'')}</small><input type="file" multiple accept="image/*,application/pdf" data-up="${f.field}"></label><div class="flist">${fs.map(x => `<div class="fitem"><span>${x.type==='application/pdf'?'📄':'🖼'} ${esc(x.name)}</span>${S.locked?'':`<button type="button" data-del="${x.id}" aria-label="刪除 ${esc(x.name)}">刪除</button>`}</div>`).join('')}${S.uploading===f.field?'<div class="fitem"><span>上傳中…</span></div>':''}</div></div>`;
    }
  }
  return `<div class="fld ${err?'bad':''}">${lab}${inner}${err?`<div class="err">${esc(err)}</div>`:''}</div>`;
}

function render(){
  const secs = sections(S.a.industry || 'other');
  const done = secs.filter(secDone).length;
  const logoBlock = `<header><div class="wrap top"><img src="${LOGO}" alt="維拓傳媒"><div><b>維拓傳媒</b><small>VICTOR MEDIA DIVISION</small></div></div></header>`;
  if (S.submitted){
    app.innerHTML = logoBlock + `<div class="wrap msg"><span class="eyebrow">THANK YOU</span><h1>收到了，謝謝你！</h1><p class="lead" style="margin:0 auto 26px">我們會照你填的資料開始建置，有不清楚的地方會再打給你。完成後會先給你試用，你覺得像你了再正式上線。</p><div class="row" style="justify-content:center"><button class="btn pri" data-act="pdf">下載 PDF 留存</button>${S.locked?'':'<button class="btn" data-act="edit">回去修改</button>'}</div></div>`;
    return;
  }
  app.innerHTML = logoBlock + `
  <div class="wrap hero"><span class="eyebrow">AI 客服建置問卷</span><h1>${S.a.store_name ? esc(S.a.store_name) + '，<br>' : ''}跟我們說說你的店。</h1>
  <p class="lead">大約 20 分鐘。每填一格都會自動儲存，可以分好幾次填完，換手機也接得下去。不確定的先留白，我們會再跟你確認。</p></div>
  <div class="bar"><div class="wrap"><div class="track"><div class="fill" style="width:${Math.round(done/secs.length*100)}%"></div></div><span>${done}／${secs.length} 段</span><span class="save" id="save">${esc(S.saving)}</span></div></div>
  <div class="wrap"><div class="secs">${secs.map((s,i) => {
    const open = S.open === s.id;
    return `<div class="sec ${open?'open':''} ${secDone(s)?'done':''}"><button type="button" data-sec="${s.id}" aria-expanded="${open}"><span class="num">${secDone(s)&&!open?'✓':i+1}</span><span class="st"><b>${esc(s.t)}</b>${open?'':`<small>${esc(s.d)}</small>`}</span><span class="mark" aria-hidden="true">${open?'−':'+'}</span></button>${open?`<div class="body"><p class="desc">${esc(s.d)}</p>${s.f.map(fieldHTML).join('')}<div class="next">${i<secs.length-1?`<button type="button" class="btn" data-sec="${secs[i+1].id}">下一段：${esc(secs[i+1].t)} →</button>`:''}</div></div>`:''}</div>`;
  }).join('')}</div>
  <div class="submit"><b style="font-size:18px">都填好了嗎？</b><p>送出後我們就開始建置。之後想補資料，用同一條連結回來改就好。</p><div class="row"><button class="btn pri" data-act="submit">送出問卷</button><button class="btn" data-act="pdf">先下載 PDF</button></div></div></div>
  <footer><div class="wrap">維拓傳媒｜維拓顧問有限公司　LINE @898biiyu　這份問卷只有收到連結的人看得到。</div></footer>`;
}

let saveTimer;
function changed(){
  S.saving = '儲存中…'; const el = document.getElementById('save'); if (el) el.textContent = S.saving;
  try { localStorage.setItem(LS, JSON.stringify(S.a)); } catch(e){}
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try { await call({action:'save', token, answers:S.a}); S.saving = '已自動儲存'; }
    catch(e){ S.saving = '暫時沒存到，會再試'; saveTimer = setTimeout(changed, 8000); }
    const el = document.getElementById('save'); if (el) el.textContent = S.saving;
  }, 1200);
}
function refreshBar(){
  const secs = sections(S.a.industry || 'other'), done = secs.filter(secDone).length;
  const fill = document.querySelector('.fill'); if (fill) fill.style.width = Math.round(done/secs.length*100) + '%';
  const sp = document.querySelector('.bar span'); if (sp) sp.textContent = `${done}／${secs.length} 段`;
}

app.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.k){ S.a[t.dataset.k] = t.value; if (S.errors[t.dataset.k]){ delete S.errors[t.dataset.k]; t.closest('.fld')?.classList.remove('bad'); t.closest('.fld')?.querySelector('.err')?.remove(); } }
  else if (t.dataset.faq){ S.a.faq = Object.assign({}, S.a.faq, {[t.dataset.faq]: t.value}); }
  else if (t.dataset.c){ const set = new Set(S.a[t.dataset.c]||[]); t.checked ? set.add(t.value) : set.delete(t.value); S.a[t.dataset.c] = [...set]; }
  else return;
  changed(); refreshBar();
});
app.addEventListener('change', e => { if (e.target.dataset.k === 'industry') render(); if (e.target.dataset.up) upload(e.target); });
app.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.sec){ S.open = S.open === b.dataset.sec && !b.classList.contains('btn') ? '' : b.dataset.sec; render(); const el = document.querySelector('.sec.open'); if (el) el.scrollIntoView({block:'start', behavior:'smooth'}); return; }
  if (b.dataset.del){ if (!confirmDel(b)) return; try { await call({action:'delete_file', token, file_id:b.dataset.del}); S.files = S.files.filter(x => x.id !== b.dataset.del); render(); } catch(err){ toast(err.message); } return; }
  if (b.dataset.act === 'pdf') return printPDF();
  if (b.dataset.act === 'edit'){ S.submitted = false; render(); window.scrollTo(0,0); return; }
  if (b.dataset.act === 'submit') return submit(b);
});
function confirmDel(b){ if (b.dataset.sure) return true; b.dataset.sure = 1; b.textContent = '確定刪除？'; setTimeout(() => { if (b.isConnected){ delete b.dataset.sure; b.textContent = '刪除'; } }, 3000); return false; }

async function submit(btn){
  const secs = sections(S.a.industry || 'other'); S.errors = {};
  for (const s of secs) for (const f of s.f) if (f.req && !filled(f)) S.errors[f.k] = '這格要填喔';
  if (S.a.phone && !/^[0-9+\-\s()]{8,}$/.test(S.a.phone)) S.errors.phone = '手機號碼看起來不對';
  if (Object.keys(S.errors).length){ S.open = secs.find(s => s.f.some(f => S.errors[f.k])).id; render(); document.querySelector('.bad')?.scrollIntoView({block:'center'}); toast('還有必填的沒寫'); return; }
  btn.disabled = true; btn.textContent = '送出中…';
  try { clearTimeout(saveTimer); await call({action:'submit', token, answers:S.a}); S.submitted = true; render(); window.scrollTo(0,0); }
  catch(err){ toast(err.message); btn.disabled = false; btn.textContent = '送出問卷'; }
}

async function shrink(file){
  if (!file.type.startsWith('image/') || file.type === 'image/gif') return file;
  const img = await createImageBitmap(file).catch(() => null); if (!img) return file;
  const max = 1600, r = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width*r); c.height = Math.round(img.height*r);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const blob = await new Promise(res => c.toBlob(res, 'image/jpeg', 0.82));
  return new File([blob], file.name.replace(/\.\w+$/, '') + '.jpg', {type:'image/jpeg'});
}
const b64 = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(f); });
async function upload(input){
  const field = input.dataset.up, list = [...input.files]; input.value = '';
  S.uploading = field; render();
  let fail = 0;
  for (const raw of list){
    try {
      const f = await shrink(raw);
      if (f.size > 5*1024*1024){ fail++; continue; }
      const r = await call({action:'upload', token, field, name:raw.name, type:f.type, b64: await b64(f)});
      S.files.push(r.file);
    } catch(e){ fail++; }
  }
  S.uploading = ''; render(); refreshBar();
  toast(fail ? `有 ${fail} 個檔案沒傳成功（太大或格式不對）` : '上傳完成');
}

function printPDF(){
  const p = document.getElementById('print');
  const d = new Date().toLocaleDateString('zh-TW');
  p.innerHTML = `<div class="p-head"><h1>${esc(S.a.store_name || '店家')}｜AI 客服建置問卷</h1><div>維拓傳媒<br>${d}</div></div>` + summaryHTML(S.a, S.files);
  const t = document.title; document.title = `${S.a.store_name || '店家'}_AI客服問卷_${d.replace(/\//g,'')}`;
  setTimeout(() => { window.print(); document.title = t; }, 50);
}

(async function init(){
  if (!token){ app.innerHTML = `<div class="wrap msg"><span class="eyebrow">維拓傳媒</span><h1>這是專屬填寫連結</h1><p class="lead" style="margin:0 auto">請使用維拓傳媒傳給你的完整連結開啟。</p></div>`; return; }
  try {
    const r = await call({action:'load', token});
    let a = r.answers || {};
    try { const loc = JSON.parse(localStorage.getItem(LS) || 'null'); if (loc && Object.keys(loc).length > Object.keys(a).length && !r.submitted_at) a = loc; } catch(e){}
    if (!a.store_name && r.store_name) a.store_name = r.store_name;
    if (!a.contact_name && r.contact_name) a.contact_name = r.contact_name;
    if (!a.industry && r.industry) a.industry = r.industry;
    if (!a.send_mode) a.send_mode = 'auto';
    S.a = a; S.files = r.files || []; S.locked = r.locked; S.status = r.status;
    if (r.locked) S.submitted = true;
    render();
  } catch(e){
    app.innerHTML = `<div class="wrap msg"><span class="eyebrow">維拓傳媒</span><h1>連結打不開</h1><p class="lead" style="margin:0 auto">${esc(e.message)}</p></div>`;
  }
})();
</script>
