PAGES.Plan = class extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { plan: "pro", ticket: 2500, extra: 4 };
  }
  renderVals() {
    const fmt = (n) => Math.round(n).toLocaleString("zh-TW");
    const pro = this.state.plan === "pro";
    const fee = pro ? 4980 : 1980;
    const setup = pro ? 29800 : 12800;
    const setupMonth = setup / 12;
    const ticket = Math.max(0, Number(this.state.ticket) || 0);
    const extra = Math.max(0, Number(this.state.extra) || 0);
    const revenue = ticket * extra;
    const net = revenue - fee - setupMonth;
    const be = ticket > 0 ? Math.ceil((fee + setupMonth) / ticket) : "—";
    const be2 = ticket > 0 ? Math.ceil(fee / ticket) : "—";
    return {
      ticket: this.state.ticket,
      extra: this.state.extra,
      setTicket: (e) => this.setState({ ticket: e.target.value }),
      setExtra: (e) => this.setState({ extra: e.target.value }),
      pickBasic: () => this.setState({ plan: "basic" }),
      pickPro: () => this.setState({ plan: "pro" }),
      basicBg: pro ? "transparent" : "#d6b46a",
      basicFg: pro ? "#d6b46a" : "#0d0c0b",
      proBg: pro ? "#d6b46a" : "transparent",
      proFg: pro ? "#0d0c0b" : "#d6b46a",
      revenue: fmt(revenue),
      fee: fmt(fee),
      setupMonth: fmt(setupMonth),
      net: (net < 0 ? "−" : "") + fmt(Math.abs(net)),
      netColor: net < 0 ? "#ff9494" : "#d6b46a",
      breakeven: be,
      breakeven2: be2
    };
  }
}

const VIEWS = {"main": "Main", "diff": "Diff", "week": "How", "plan": "Plan", "contact": "Contact"}, TITLES = {"Main": "總覽", "Diff": "差在哪", "How": "一位客人的一週", "Plan": "方案與試算", "Contact": "預約與問答"};
const SLUG = Object.fromEntries(Object.entries(VIEWS).map(([s,n]) => [n,s]));
const inst = {};
let current = VIEWS[new URLSearchParams(location.search).get('p')] || 'Main';

function get(scope, path){
  path = path.trim();
  if (path === 'true') return true; if (path === 'false') return false;
  if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
  return path.split('.').reduce((o,k) => o == null ? undefined : o[k], scope);
}
const ONE = /^\{\{([^{}]+)\}\}$/, ANY = /\{\{([^{}]+)\}\}/g;
function interp(str, scope){ return str.replace(ANY, (_,p) => { const v = get(scope,p); return v == null ? '' : String(v); }); }

function proc(node, scope, out){
  if (node.nodeType === 3){ const t = node.textContent; out.appendChild(document.createTextNode(t.includes('{{') ? interp(t,scope) : t)); return; }
  if (node.nodeType !== 1) return;
  const tag = node.tagName.toLowerCase();
  if (tag === 'sc-for'){
    const list = get(scope, node.getAttribute('list').match(ONE)[1]) || [];
    const as = node.getAttribute('as');
    list.forEach((item,i) => { const s = Object.assign(Object.create(scope), {[as]: item, index: i}); node.childNodes.forEach(c => proc(c, s, out)); });
    return;
  }
  if (tag === 'sc-if'){
    if (get(scope, node.getAttribute('value').match(ONE)[1])) node.childNodes.forEach(c => proc(c, scope, out));
    return;
  }
  const el = document.createElementNS(node.namespaceURI, node.localName);
  for (const a of node.attributes){
    if (a.name.startsWith('hint-')) continue;
    const m = a.value.match(ONE);
    if (/^on[a-z]+$/i.test(a.name) && m){ const fn = get(scope, m[1]); if (typeof fn === 'function') el.addEventListener(a.name.slice(2).toLowerCase(), fn); continue; }
    if (m){ const v = get(scope, m[1]); if (v === false || v == null) continue; el.setAttribute(a.name, v === true ? '' : String(v)); if (a.name === 'value') el.value = String(v); continue; }
    if (a.name === 'src' && a.value === 'logo.png'){ el.setAttribute('src', LOGO); continue; }
    el.setAttribute(a.name, a.value.includes('{{') ? interp(a.value, scope) : a.value);
  }
  const src = tag === 'template' ? node.content : node;
  src.childNodes.forEach(c => proc(c, scope, el));
  out.appendChild(el);
}

function render(){
  const app = document.getElementById('app');
  const f = document.activeElement, fid = f && f.id, sel = f && f.selectionStart != null ? [f.selectionStart, f.selectionEnd] : null;
  if (!inst[current]) inst[current] = new PAGES[current]({});
  const scope = inst[current].renderVals() || {};
  const frag = document.createDocumentFragment();
  document.getElementById('tpl-' + current).content.childNodes.forEach(c => proc(c, scope, frag));
  app.replaceChildren(frag);
  document.title = (current === 'Main' ? 'AI 客服' : TITLES[current] + '｜AI 客服') + '｜維拓傳媒';
  if (fid){ const n = document.getElementById(fid); if (n){ n.focus(); try { if (sel) n.setSelectionRange(sel[0], sel[1]); } catch(e){} } }
}
function go(name, push){
  if (!PAGES[name]) return;
  current = name;
  if (push) history.pushState({p: name}, '', '?p=' + SLUG[name]);
  render(); window.scrollTo(0, 0);
}
document.addEventListener('click', e => {
  const a = e.target.closest && e.target.closest('a[data-view]');
  if (!a || e.metaKey || e.ctrlKey || e.shiftKey) return;
  e.preventDefault(); go(a.dataset.view, true);
});
window.addEventListener('popstate', () => { current = VIEWS[new URLSearchParams(location.search).get('p')] || 'Main'; render(); });
render();
</script>
